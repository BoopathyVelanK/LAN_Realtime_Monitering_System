[server]
# Base URL of the Spring Boot backend (note the /api context path).
url = http://localhost:8080/api

# Must match securesoc.agent.registration-secret / AGENT_REGISTRATION_SECRET
# configured on the backend. Ask your admin for this value — never commit
# the real value to source control.
registration_secret = CHANGE_THIS_AGENT_REGISTRATION_SECRET

# Optional — leave blank to register unassigned; an admin assigns the lab later.
lab_id =

[agent]
heartbeat_interval_seconds = 15
monitoring_interval_seconds = 60
retry_interval_seconds = 10
http_timeout_seconds = 10
log_level = INFO

# Where the agent persists its endpoint id + token after first registration.
# Delete this file to force the agent to re-register as a "new" device.
state_file = agent_state.json

version = 0.1.0-PHASE2

# --- Offline event buffering (SQLite-backed) ---
# All optional — sensible defaults apply if any/all of these are omitted,
# so a config.ini from before this feature keeps working unchanged.
# Applies to monitoring events only (login, logout, idle, running-apps,
# usb, vpn, network/internet usage) — not heartbeats or registration,
# which aren't point-in-time replayable data. See offline_queue.py.
offline_queue_db_file = offline_queue.db
offline_queue_max_size = 5000
offline_queue_max_db_size_mb = 50
# discard_oldest (default) or reject_new — policy applied when the queue is full.
offline_queue_on_full = discard_oldest
offline_queue_max_retry_count = 10
offline_queue_wal_enabled = true
offline_replay_interval_seconds = 30
offline_replay_batch_size = 50

# --- Offline queue reliability & maintenance (all optional, sensible defaults) ---
# queue_integrity_check: run PRAGMA integrity_check at startup; a corrupted
#   DB is preserved (renamed with a timestamp) and replaced with a fresh one.
queue_integrity_check = true
# maintenance_interval_hours: how often PRAGMA optimize (and, if warranted,
#   VACUUM) runs — piggybacked on the replay thread, no extra thread needed.
maintenance_interval_hours = 24
# vacuum_threshold: VACUUM only runs once this many rows have been deleted
#   since the last VACUUM — never on every delete.
vacuum_threshold = 500
# queue_warning_threshold: log a WARNING when the queue grows past this size.
queue_warning_threshold = 1000
# backoff_max_minutes: cap for the replay thread's exponential backoff
#   (starts at offline_replay_interval_seconds, doubles on each consecutive
#   connectivity failure, resets immediately after any successful replay).
backoff_max_minutes = 30
