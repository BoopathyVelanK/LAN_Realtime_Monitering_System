# Test-only overrides. Everything else comes from src/main/resources/application.yml.

# @Scheduled processing (EndpointOfflineSweeper) is off in tests. Spring caches every
# @SpringBootTest context for the whole run, and all of them now share one PostgreSQL
# container; left on, each cached context would keep sweeping that shared database every
# 15s and could flip another test's endpoints OFFLINE mid-test. Production default is
# unchanged (see SchedulingEnablementConfig); the sweeper is covered by
# EndpointOfflineSweeperTest / EndpointOfflineSweeperIntegrationTest.
securesoc.scheduling.enabled=false

# Each cached context owns a Hikari pool, and they all hit the same PostgreSQL server
# (default max_connections=100). With main's maximum-pool-size=10 and minimum-idle
# defaulting to the same value, ~14 cached contexts could hold ~140 connections.
# Bound the pool per context instead of relying on how many contexts happen to exist.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
