spring:
  application:
    name: securesoc-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/securesoc}
    username: ${DB_USERNAME:securesoc}
    password: ${DB_PASSWORD:securesoc}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates it matches the
      # entities on startup so drift is caught immediately instead of
      # silently auto-altering production tables.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

securesoc:
  jwt:
    # HS256 secret - MUST be overridden via JWT_SECRET env var in any real
    # deployment. This default is only for local dev and is intentionally
    # long enough (256+ bits) to satisfy jjwt's HS256 key-length check.
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-before-deploying-securesoc-32bytes-min}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
  agent:
    # Shared secret the Python agent presents on POST /agents/register.
    # MUST match securesoc-agent/config.ini's [server] registration_secret.
    registration-secret: ${AGENT_REGISTRATION_SECRET:dev-only-agent-registration-secret-change-me}
    heartbeat-timeout-seconds: ${AGENT_HEARTBEAT_TIMEOUT_SECONDS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.securesoc: INFO
    org.springframework.security: INFO

