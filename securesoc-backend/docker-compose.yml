services:
  postgres:
    image: postgres:18.4
    container_name: securesoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: securesoc
      POSTGRES_USER: securesoc
      POSTGRES_PASSWORD: securesoc
    ports:
      - "5432:5432"
    volumes:
      - securesoc-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securesoc -d securesoc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  securesoc-postgres-data:
    external: true