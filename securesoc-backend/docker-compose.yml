services:
  postgres:
    image: postgres:16-alpine
    container_name: securesoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: securesoc
      POSTGRES_USER: securesoc
      POSTGRES_PASSWORD: securesoc
    ports:
      - "5432:5432"
    volumes:
      - securesoc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securesoc -d securesoc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  securesoc_pgdata:
